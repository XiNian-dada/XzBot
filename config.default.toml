# =========================
# XzBot Runtime Config
# =========================
#
# 这是主配置文件模板。
# 设计目标是：
# 1. 让大多数用户只改这一个文件就能跑起来
# 2. 把真正复杂、很长、很少改的部分留给可选覆盖文件
#
# 可选覆盖文件放在同一个目录下，例如：
# - config/ai.toml
# - config/persona.toml
# - config/search.toml
# - config/network.toml
#
# 加载顺序：
# 1) 先读取 config/config.toml
# 2) 再读取上述同目录覆盖文件（如果存在）
# 3) 后读取的配置会覆盖前面的同名字段
#
# 例如：
# - 主配置里先写一个简短 [persona]
# - 你后续想把大段人设拆出去，就新建 config/persona.toml 覆盖它
#
# 分群人设仍然和以前一样，继续使用：
# [[persona.group_overrides]]

debug = true

[server]
host = "0.0.0.0"
port = 3000
ws_path = "/onebot/v11/ws"
access_token = ""
verify_token = false

[owner]
qq = 123456789

[policy]
permission = "whitelist"

[group]
whitelist = []
blacklist = []
trigger_mode = "at"
prefixes = ["/xzbot", "xz "]
keywords = ["xzbot", "特狼谱"]
require_at = false
mention_sender = true

[persona]
system = """
你是 XzBot。
回答时保持简洁、直接、可执行。
"""

[ai]
# 推荐首次先用 mock 跑通 NapCat -> XzBot -> 回复链路
provider = "mock"
base_url = "https://api.openai.com/v1"
api_key = ""
model = "mock"
# 当主模型超时/上游报错时，按顺序尝试这些候补模型。
fallback_models = []
# 某些 OpenAI 兼容网关只有在 stream=true 时才会正常返回正文。
stream_chat_completions = false
temperature = 0.7
max_tokens = 512
timeout_ms = 20000

[search]
provider = "builtin"
searxng_url = ""

[network]
proxy_enabled = false
proxy_url = ""
proxy_test_url = "https://www.baidu.com"
proxy_timeout_ms = 5000

[web_admin]
enabled = false
token = ""
title = "XzBot Console"
